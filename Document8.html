    <style type="text/css">
    body{
        background-color: #f5f5f5;
    }
    .tablist{
        width: 380px;
        height: 50px;
        background-color: #fff;
        border-top: none;
        display: flex;
        margin: 50px auto;
    }
    .tablist .tab{
        flex: 1;
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        cursor: pointer;
    }
    .tablist .tab:nth-child(odd){
        background-color: skyblue;}
        .tablist .tab:nth-child(even){
        background-color: khaki;
        }
    .tablist .tab-icon{
        display: block;
        width: 24px;
        height: 24px;
        /*display: block;
        background-position: center; */
    }
    .tablist  .icon-home{
    /* background-image: url("E:\laoru\OneDrive\图片\zhuye.svg./images-/icon-home.png");}*/
    background-image: url("E:\laoru\OneDrive\图片\zhuye.svg./images-/icon-home.png");} 
    .tablist  .icon-message{
        background-image: url("E:\laoru\OneDrive\图片\xiaoxi6.svg./images-/icon-message.png");}
    .tablist  .icon-car{
        background-image: url("E:\laoru\OneDrive\图片\goumai.svg./images-/icon-car.png");}
    .tablist  .icon-me{
        background-image: url("E:\laoru\OneDrive\图片\icon-myself.svg./images-/icon-me.png");}
    .tablist .tab .active{
        color: rgb(236 11 37 );
        font-weight: bold;
    }
    .tablist .tab .active .icon-message {
        background-image: url("./images/icon-message2.png");
    }
        
    </style>
</head>
